name: Android CI & Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and upload APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
      SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
      SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew scripts/check-project.sh

      - name: Run project checks
        run: ./scripts/check-project.sh

      - name: Check generated files are committed
        shell: bash
        run: |
          # DexKit fingerprints the names host.syms lists; a stale list leaves a
          # renamed member unrecoverable after a launcher update.
          python3 scripts/host-symbols.py
          python3 scripts/inventory.py > docs/inventory.json
          if ! git diff --exit-code -- app/src/main/resources/ple/host.syms docs/inventory.json; then
            echo "::error::Generated files drifted. Run scripts/host-symbols.py and 'scripts/inventory.py > docs/inventory.json', then commit." >&2
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Read project version
        id: metadata
        shell: bash
        run: |
          VERSION="$(sed -n 's/^val appVersion = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/outputs/apk/release/PixelLauncherEvolved-v$VERSION.apk" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$VERSION." >&2
            exit 1
          fi

      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pull-request builds are intentionally unsigned because signing secrets are not exposed to PR code."
            exit 0
          fi

          missing=()
          [[ -n "$SIGNING_KEY_BASE64" ]] || missing+=(SIGNING_KEY)
          [[ -n "$SIGNING_KEY_ALIAS" ]] || missing+=(ALIAS)
          [[ -n "$SIGNING_STORE_PASSWORD" ]] || missing+=(STORE_PASSWORD)
          [[ -n "$SIGNING_KEY_PASSWORD" ]] || missing+=(KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            echo "Add all four secrets under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/pixellauncherevolved-release.keystore"
          chmod 600 "$RUNNER_TEMP/pixellauncherevolved-release.keystore"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pixellauncherevolved-release.keystore
          ANDROID_KEYSTORE_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          APK_PATH="${{ steps.metadata.outputs.apk_path }}"
          test -f "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -n "$APKSIGNER"
            CERTS="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
            echo "$CERTS"
            if grep -q "CN=Android Debug" <<< "$CERTS"; then
              echo "The release APK is signed with the debug key, not the release key." >&2
              exit 1
            fi
          else
            echo "Unsigned pull-request APK built successfully."
          fi

          # Published beside the APK, so a download can be checked against what CI built.
          (cd "$(dirname "$APK_PATH")" && sha256sum "$(basename "$APK_PATH")" > "$(basename "$APK_PATH").sha256")
          cat "$APK_PATH.sha256"

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelLauncherEvolved-v${{ steps.metadata.outputs.version }}-${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pixel Launcher Evolved v${{ steps.metadata.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          fail_on_unmatched_files: true
          token: ${{ github.token }}
